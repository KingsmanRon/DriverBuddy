        <meta name="description" content="DriverBuddy - Secure, verified digital identification for modern drivers" />
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

        <meta name="apple-mobile-web-app-title" content="DriverBuddy" />
        <title>DriverBuddy - Digital Driver's License</title>
        <!-- Configure WebAssembly module loader for Barkoder SDK -->
        <script>
            // Set up Module configuration before any WASM modules load
            window.Module = {
                locateFile: function(path) {
                    console.log('[Barkoder] locateFile called with path:', path);
                    // Try multiple possible locations for WASM files
                    if (path.endsWith('.wasm')) {
                        // In production, webpack copies to static/js/
                        // In development, we serve from public/
                        const possiblePaths = [
                            '/static/js/' + path,
                            '/' + path,
                            '/public/' + path
                        ];
                        const fullPath = possiblePaths[0]; // Try static/js first
                        console.log('[Barkoder] Returning WASM path:', fullPath);
                        return fullPath;
                    }
                    console.log('[Barkoder] Returning default path:', path);
                    return path;
                }
            };
            console.log('[Barkoder] Module.locateFile configured');
        </script>
    </head>
